<title>A Plus SimRacing Lounge</title>

<style>
/* APlus Lounge – Test-App (Roger 25.10.2026). Bewusst nur dunkel: Lounge-Look wie TimeTool und TV, Marke Dunkelblau/Hellblau/Gold.
   Layout: Handy-App – oben Kopfzeile, Mitte Inhalt, unten 5 Reiter. Am Computer mittig in Handy-Breite. */
:root{
  color-scheme:dark;
  --bg:#070D18;--bg2:#0B1424;--card:#0F1A2E;--card2:#14233D;--line:#22324F;--line2:#2E4267;
  --fg:#FFFFFF;--muted:#A7B6CF;--dim:#7487A6;
  --blue:#00B2E7;--blue2:#38C7F2;--navy:#24426A;--gold:#FFBE32;--red:#FF4D4D;--green:#3FD47A;
  --l-diamant:#5BC8E8;--l-carbon:#A0A4AE;--l-gold:#F5C542;--l-silber:#C9CED6;--l-bronze:#CD7F32;--l-leder:#9A6A3A;
  --disp:'Rajdhani','Segoe UI',Roboto,Arial,sans-serif;
  --body:'Segoe UI',Roboto,system-ui,-apple-system,Arial,sans-serif;
  --r:14px;--nav:64px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue2)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Rahmen: Handybreite, am Computer mittig */
#shell{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
@media (min-width:560px){body{background:#03070E}#shell{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6)}}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,13,24,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:56px}
.top .lg{width:34px;height:30px;object-fit:contain;flex:0 0 auto}
.top h1{margin:0;font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.top h1.lt{font-size:18px;white-space:normal;line-height:1.08}
.top h1 small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;margin-top:-2px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;flex:0 0 auto}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}

/* Inhalt */

.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sh h2{margin:0;font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.sh a,.lnk{color:var(--blue2);font-weight:600;font-size:13.5px;text-decoration:none;background:none;border:0;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
button.li:active{background:var(--card2)}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.chev{color:var(--dim);flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);padding:12px 16px;font-weight:700;font-size:15px;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#04121C}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241800}
.btn.ok{background:rgba(63,212,122,.14);border-color:rgba(63,212,122,.6);color:var(--green)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px}.pager .pg{min-width:38px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:#fff;font:600 15px/1 var(--body);cursor:pointer}.pager .pg.on{background:var(--blue);border-color:var(--blue);color:#06101e}.pager .pg[disabled]{opacity:.35;cursor:default}.pager .pgd{color:var(--muted);padding:0 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;white-space:nowrap}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-family:var(--disp);font-weight:700;font-size:14.5px;letter-spacing:.03em;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:#111;white-space:nowrap}
.b-Diamant{background:var(--l-diamant)}.b-Carbon{background:var(--l-carbon)}.b-Gold{background:var(--l-gold)}.b-Silber{background:var(--l-silber)}.b-Bronze{background:var(--l-bronze);color:#fff}.b-Leder{background:var(--l-leder);color:#fff}.b-none{background:var(--line2);color:var(--fg)}
.tag{display:inline-flex;align-items:center;white-space:nowrap;flex:0 0 auto;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted)}
.tag.blue{border-color:rgba(0,178,231,.55);color:var(--blue2)}.tag.gold{border-color:rgba(255,190,50,.6);color:var(--gold)}.tag.red{border-color:rgba(255,77,77,.6);color:var(--red)}.tag.green{border-color:rgba(63,212,122,.6);color:var(--green)}
.big{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;min-width:0}
.kpi b{display:block;font-family:var(--disp);font-size:22px;line-height:1.05}
.kpi span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.note{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Tabellen (Ranglisten) */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:linear-gradient(180deg,#1C3256,#172A48);color:#fff;text-align:left;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--line2)}
.tb td{padding:9px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tb tr:first-child td{border-top:0}
.tb .r{text-align:right}
.tb .rk{font-family:var(--disp);font-weight:700;font-size:16px;width:34px}
.tb tr.me td{background:rgba(0,178,231,.14)}
.tb tr.me td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.tb tr.p1 .rk{color:var(--gold)}.tb tr.p2 .rk{color:#D9DEE6}.tb tr.p3 .rk{color:#E0924E}
.tb .nm{max-width:0;width:100%;overflow:hidden;text-overflow:ellipsis}
.tb .nm small{display:block;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.tb .t{font-weight:700}
.tb tr.gapr td{background:var(--bg2);color:var(--dim);text-align:center;font-size:12px;padding:5px}
.tb th,.tb td{padding-left:8px;padding-right:8px}
.tb th:first-child,.tb td:first-child{padding-left:12px}.tb th:last-child,.tb td:last-child{padding-right:12px}
a.li{color:inherit;text-decoration:none}
#secBox{scroll-margin-top:80px;scroll-margin-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px))}

/* Rennlizenz-Karte */
.lic{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 14px;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(135deg,#132643 0%,#0E1B31 55%,#0B1629 100%);min-width:0}
.lic::before{content:"";position:absolute;right:-84px;top:-64px;width:140px;height:220px;transform:rotate(28deg);background:var(--lc,#2E4267);opacity:.85}
.lic::after{content:"";position:absolute;right:46px;top:-64px;width:12px;height:200px;transform:rotate(28deg);background:var(--lc,#2E4267);opacity:.45}
.lic .kl{padding-right:64px}
.lic.Diamant::before{background:linear-gradient(160deg,#9FE8FF,#5BC8E8 40%,#B8F0FF 60%,#4AB4DC)}
.lic.Carbon::before{background:repeating-linear-gradient(45deg,#3A3F48 0 6px,#2A2E35 6px 12px)}
.lic > *{position:relative;z-index:1}
.lic .kl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lic .nm{font-family:var(--disp);font-weight:700;font-size:25px;line-height:1.05;margin-top:2px;text-transform:uppercase;letter-spacing:.02em;max-width:72%}
.lic .lv{font-family:var(--disp);font-weight:700;font-size:40px;line-height:.95;margin-top:10px;letter-spacing:.02em}
.lic .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.lic .meta b{color:var(--fg)}
.lic .goal{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.18);font-size:13.5px}
/* Lizenzkarte Serie 2 «Rennstreifen» (Roger 30.10.2026): dunkle Karte, Band aus dem Material der Stufe mit Doppelstreifen, Stufe in Metall-Schrift */
.lic.rs::before,.lic.rs::after{display:none}
.lic.rs .band{position:absolute;z-index:0;top:-80px;right:-20px;width:86px;height:340px;transform:rotate(24deg)}
.lic.rs .band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 45%)}
.lic.rs .st1,.lic.rs .st2{position:absolute;z-index:0;top:-80px;width:5px;height:340px;transform:rotate(24deg);background:var(--sc)}
.lic.rs .st1{right:76px}.lic.rs .st2{right:89px;opacity:.6}
.lic.rs .kl{padding-right:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:92px}
.lic.rs .nm,.lic.rs .lv{margin-right:96px;max-width:none}
.lic.rs{padding:15px 16px;min-height:150px}.lic.rs .nm{font-size:23px}.lic.rs .lv{font-size:40px;letter-spacing:.04em;text-transform:uppercase;margin-top:8px}.lic.rs .meta{margin-top:9px}
.lic.mt{padding:15px 16px;min-height:150px;border-color:rgba(255,255,255,.25)}.lic.mt::before,.lic.mt::after{display:none}
.lic.mt .shade{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(7,13,24,.05),rgba(7,13,24,.55))}
.lic.mt.Diamant .shade,.lic.mt.Silber .shade,.lic.mt.Gold .shade{background:linear-gradient(180deg,rgba(7,13,24,.25),rgba(7,13,24,.7))}
.lic.mt .fac{position:absolute;inset:0;z-index:0;background:linear-gradient(60deg,transparent 49%,rgba(255,255,255,.25) 50%,transparent 51%),linear-gradient(-60deg,transparent 49%,rgba(255,255,255,.2) 50%,transparent 51%),linear-gradient(0deg,transparent 49%,rgba(255,255,255,.15) 50%,transparent 51%);background-size:46px 80px}
.lic.mt .stitch{position:absolute;inset:7px;border:1.5px dashed rgba(240,214,170,.55);border-radius:12px;z-index:0;pointer-events:none}
.lic.mt .kl{padding-right:0;color:rgba(255,255,255,.75)}.lic.mt .nm{font-size:23px;max-width:none}.lic.mt .lv{font-size:42px;letter-spacing:.04em;text-transform:uppercase;margin-top:8px;color:#fff!important;text-shadow:0 2px 10px rgba(0,0,0,.45)}.lic.mt .meta{margin-top:9px;color:rgba(255,255,255,.8)}
.lkw{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}.lkw button{border:1px solid var(--line2);background:transparent;color:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-weight:700;cursor:pointer}.lkw button.on{background:var(--blue);color:#00141c;border-color:var(--blue)}
.sn{margin-top:12px;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,190,50,.35);background:linear-gradient(135deg,rgba(255,190,50,.10),rgba(255,190,50,.02))}
.sn.ok{border-color:rgba(34,224,107,.55);background:linear-gradient(135deg,rgba(34,224,107,.16),rgba(34,224,107,.03))}
.sn .snh{display:flex;gap:10px;align-items:center}.sn .sni{font-size:24px;line-height:1}
.sn .snh b{display:block;font-family:var(--disp);font-size:19px;line-height:1.1}.sn.ok .snh b{color:#3FD47A}
.sn .snh span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.sn .snf{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:700;color:#fff}.sn.ok .snf{color:#3FD47A}
.sn p{margin:8px 0 0;font-size:13px;line-height:1.45;color:#DDE6F3}
.sn .snd{display:flex;gap:5px;margin-top:9px}.sn .snd i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.12)}.sn .snd i.on{background:linear-gradient(90deg,#FFBE32,#ffd76b)}
.list.clubchat{border-color:rgba(63,212,122,.45);background:linear-gradient(135deg,rgba(63,212,122,.10),rgba(63,212,122,.02) 60%);box-shadow:0 0 0 1px rgba(63,212,122,.12),0 6px 22px rgba(63,212,122,.08)}
.crl .li.done .date{border-color:#3FD47A}.crl .li.next{background:linear-gradient(90deg,rgba(0,178,231,.14),transparent 70%);box-shadow:inset 3px 0 0 #00B2E7}.crl .li.plan{opacity:.85}.crl .li.past{opacity:.55}
.cst{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 7px;white-space:nowrap}
.cst.done{background:rgba(63,212,122,.16);color:#3FD47A}.cst.next{background:#00B2E7;color:#00141c}.cst.plan{background:rgba(255,255,255,.08);color:var(--muted)}
.wr{border-color:rgba(56,199,242,.3);background:linear-gradient(135deg,rgba(56,199,242,.08),var(--card) 60%)}
.wr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.wr-top b{font-family:var(--disp);font-size:23px}.wr-top span{font-size:12.5px;color:var(--muted)}
.wr .trk{position:relative;height:42px;margin-top:6px}

.wr .fl{position:absolute;left:0;top:26px;height:4px;border-radius:4px;width:var(--p);background:linear-gradient(90deg,rgba(56,199,242,.15),var(--blue2));box-shadow:0 0 10px rgba(56,199,242,.6);animation:wrf 3.2s cubic-bezier(.3,.1,.2,1) .3s both}
.wr .car{position:absolute;top:9px;left:calc(var(--p) - 62px);width:66px;height:auto;animation:wrc 3.2s cubic-bezier(.3,.1,.2,1) .3s both}

.kp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kp3>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.kp3 i{font-style:normal;font-size:20px;display:block;margin-bottom:3px}.kp3 b{display:block;font-family:var(--disp);font-size:26px;line-height:1}.kp3 span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.ms{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:10px}

/* ---- Weltreise-Karte ---- */
.wr2{position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(56,199,242,.3);background:radial-gradient(120% 90% at 0% 0%,rgba(56,199,242,.13),rgba(15,26,46,1) 55%);padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wr2 .wr-hd{display:flex;gap:12px;align-items:center}

.wr2 .wr-tx .wr-u{font-family:var(--disp);font-size:17px;color:var(--blue2);letter-spacing:.04em}

.wr2 .wr-fill{position:absolute;left:0;bottom:6px;height:10px;border-radius:6px;width:0;background:linear-gradient(90deg,rgba(56,199,242,0),rgba(56,199,242,.55));box-shadow:0 0 14px rgba(56,199,242,.45)}

  var ib=$('#iBoard');if(ib)ib.oninput=function(){st.q[ib.getAttribute('data-q')||'board']=ib.value;var pos=ib.selectionStart;render();var n=$('#iBoard');n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}};
  app.querySelectorAll('[data-act]').forEach(function(x){x.onclick=function(ev){ev.preventDefault();act(x.getAttribute('data-act'),x);};});

  bindAdmin();bindSettings();
  app.querySelectorAll('[data-legal]').forEach(function(x){x.onclick=function(ev){ev.preventDefault();legalSheet(x.getAttribute('data-legal'));};});
  var fn=$('#fNews');if(fn)fn.onsubmit=function(ev){ev.preventDefault();var t=$('#nTi').value.trim(),x=$('#nTx').value.trim();if(!t||!x){dialog('Noch nicht vollständig','<p class="note">Titel und Text brauchen beide etwas Inhalt.</p>',[{t:'OK',cls:'pri'}]);return;}
    var a=ls('admin-news')||[];a.unshift({id:'loc'+Date.now(),date:TODAY,tag:'Lounge',title:t,text:x,local:true});ls('admin-news',a);dialog('Veröffentlicht','<p class="note">Die News steht jetzt zuoberst unter «News» (in der Testversion nur auf diesem Handy).</p>',[{t:'Ansehen',cls:'pri',f:function(){go('news');}},{t:'OK'}]);};
  bindRec();wrInit();bindTroph();try{trCheck();}catch(x){if(window.console)console.error(x);}
  if($('#qr')&&window.QRCode){try{new QRCode($('#qr'),{text:'APLUS-LOUNGE:'+U,width:168,height:168,colorDark:'#0B1424',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch(x){}}
  else if($('#qr'))$('#qr').innerHTML='<div style="width:168px;height:168px;display:grid;place-items:center;color:#0B1424;font-weight:700">QR</div>';

function act(a,x){
  if(a==='trdemo'){trDemo();return;}
  if(a==='rtmore'||a==='rtless'){st.rtAll=a==='rtmore';render();return;}   // Race Time: weitere ein-/ausblenden

  if(a==='switch'){if(REAL&&REALKEYS.length<2)return;U=null;ME=null;st.guest=false;st.reply=null;st.draft={};L={step:'who',mail:(ls('user')||{}).mail||'test@aplus.ch',err:'',q:''};st.stack=[];st.path='home';drawLogin();}

function start(){
  var u=ls('user')||MEMU;
  if(u&&u.k&&D.people[u.k]){U=u.k;ME=D.people[U];st.guest=false;}
  else if(u&&u.guest){U=null;ME=null;st.guest=true;}
  else{U=null;ME=null;st.guest=false;}
  if(U&&!ME)ME=D.people[U];
  st.path=st.path||'home';chatInit();render();
}
buildEvents();
function prepData(j){if(j.names){j.combos.forEach(function(c){c.top=c.top.map(function(r){var N=j.names[r[0]];return [N[0],r[1],r[2],r[3],r[4],r[5],N[1]];});});}buildIdx(j);D=j;(D.aw.year||[]).forEach(function(r){r.nw=0;});(D.aw.evenings||[]).forEach(function(v){(v.rows||[]).forEach(function(r){r.nw='';});});   // Roger 31.10.2026: «nicht gewertet» nur im TimeTool, in der App nirgends sichtbar
ANON=!!(j.meta&&j.meta.anon);}
function loadErr(err){app.innerHTML='<div class="login"><div class="hero"><img src="logo.png" alt=""><h2>A Plus SimRacing Lounge</h2></div><div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Die Daten konnten nicht geladen werden.</b><p class="note" style="margin:0">Prüfe deine Internetverbindung und lade die Seite neu. ('+e(err.message)+')</p><button class="btn pri" id="bReload">Neu laden</button></div></div>';var r=$('#bReload');if(r)r.onclick=function(){location.reload();};}
function realErr(err,what){var m=String((err&&(err.message||err.msg||err.error_description))||err||''),st=err&&(err.status||err.code);
  if(st===429||/rate|too many|security purposes/i.test(m))return 'Zu viele Versuche. Bitte in ein paar Minuten nochmals.';
  if(what==='code')return 'Der Code stimmt nicht oder ist abgelaufen. Bitte nochmals eingeben oder einen neuen Code anfordern.';
  return 'Der Code konnte nicht gesendet werden. Bitte später nochmals versuchen.'+(m?' ('+m.slice(0,120)+')':'');}
function realMsg(t){app.innerHTML='<div class="login"><div class="flag" aria-hidden="true"></div><div class="hero"><img src="logo.png" alt="APlus SimRacing Events &amp; Lounge"><h2>A Plus SimRacing Lounge</h2><p class="muted">'+e(t)+'</p></div></div>';}
function realLogout(){var done=function(){try{ls('user',null);}catch(x){}location.reload();};try{SB.auth.signOut().then(done,done);}catch(x){done();}}
function realBlocked(mail){app.innerHTML='<div class="login"><div class="flag" aria-hidden="true"></div><div class="hero"><img src="logo.png" alt="APlus SimRacing Events &amp; Lounge"><h2>A Plus SimRacing Lounge</h2></div><div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Noch nicht freigeschaltet</b><p class="note" style="margin:0">Die E-Mail <b>'+e(mail)+'</b> ist für die App noch nicht freigeschaltet. Im Moment ist die App nur für Testerinnen und Tester offen – bald für alle Fahrerinnen und Fahrer der Lounge.</p><button class="btn full" id="bOut">Mit anderer E-Mail anmelden</button></div></div>';var b=$('#bOut');if(b)b.onclick=realLogout;}
function realAfter(s){var mail=String((s&&s.user&&s.user.email)||'').toLowerCase();L.mail=mail;realMsg('Deine Daten werden geladen …');
  SB.from('freigabe').select('fahrer,name,rolle').then(function(r){if(r.error)throw r.error;var rows=r.data||[];if(!rows.length){realBlocked(mail);return;}
    REALROLE=rows.some(function(x){return x.rolle==='betreiber';});
    return SB.from('app_daten').select('inhalt').eq('id','main').maybeSingle().then(function(d){if(d.error)throw d.error;if(!d.data||!d.data.inhalt)throw new Error('Noch keine Daten in der Zentrale');return d.data.inhalt;}).then(function(txt){prepData(JSON.parse(txt));
      REALKEYS=rows.map(function(x){return x.fahrer;}).filter(function(k,i,a){return D.people[k]&&a.indexOf(k)===i;});if(!REALKEYS.length){realBlocked(mail);return;}
      var u=ls('user')||MEMU||{},k=REALKEYS.indexOf(u.k)>=0?u.k:(REALKEYS.length===1?REALKEYS[0]:null);
      if(k){ls('user',{k:k,mail:mail});start();}else{L={step:'who',mail:mail,err:'',q:''};drawLogin();}});
  }).catch(function(err){loadErr(err);});}
function realBoot(){var t0=Date.now();realMsg('Einen Moment …');(function wait(){
  if(window.supabase&&window.supabase.createClient){try{SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'apl-sb'}});}catch(x){loadErr(x);return;}
    SB.auth.getSession().then(function(r){var ss=r&&r.data&&r.data.session;if(ss)realAfter(ss);else{L={step:'mail',mail:'',err:'',q:''};drawLogin();}},function(){L={step:'mail',mail:'',err:'',q:''};drawLogin();});return;}
  if(Date.now()-t0>15000){loadErr(new Error('Verbindung zur Lounge nicht möglich'));return;}setTimeout(wait,100);})();}
if(REAL)realBoot();
else fetch('data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('Daten nicht gefunden ('+r.status+')');return r.json();}).then(function(j){prepData(j);start();})
  .catch(loadErr);
})();
