function wpB64(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}

function wpJson(s){var j=(s&&s.toJSON)?s.toJSON():{},k=j.keys||{};return {endpoint:String((s&&s.endpoint)||j.endpoint||''),p256dh:wpN64(k.p256dh||(s&&s.getKey?wpU64(s.getKey('p256dh')):'')),auth:wpN64(k.auth||(s&&s.getKey?wpU64(s.getKey('auth')):''))};}
function wpGleich(a,b){var c=function(o){if(!o||typeof o!=='object')return JSON.stringify(o===undefined?null:o);return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+c(o[k]);}).join(',')+'}';};return c(a)===c(b);}
function wpPrefs(){var S=setting(),k={},z={};Object.keys(S.push).forEach(function(c){if(S.push[c]===false&&/^[a-z0-9_-]{1,40}$/.test(c))k[c]=false;});Object.keys(S.badge).forEach(function(c){if(S.badge[c]===false&&/^[a-z0-9_-]{1,40}$/.test(c))z[c]=false;});

function wpSchluessel(){return Promise.resolve(sbT(SB.from('km_push_konfig').select('vapid_public').eq('id',1).maybeSingle())).then(function(r){

function wpZeileLesen(ep){return Promise.resolve(sbT(SB.from('km_push_abo').select('id,aktiv,prefs,inaktiv_grund').eq('endpoint',ep).order('id',{ascending:false}))).then(function(r){if(r.error)throw r.error;var L=r.data||[];return L.filter(function(z){return z.aktiv;})[0]||L[0]||null;});}
